@switch (status) {
  @case ('notfound') {
    <div class="req-empty state-fill">
      <i class="pi pi-search"></i>
      <p>Filial não encontrada</p>
      <p-button label="Voltar para a lista" styleClass="btn--md btn--secondary" (onClick)="voltarParaLista()" />
    </div>
  }

  @case ('error') {
    <div class="load-state load-state--error state-fill">
      <i class="pi pi-exclamation-circle"></i>
      <p>Não foi possível carregar a filial</p>
      <p-button label="Voltar para a lista" styleClass="btn--md btn--secondary" (onClick)="voltarParaLista()" />
    </div>
  }

  <!-- carregando ou pronto: cada componente mostra o próprio skeleton enquanto `loading` -->
  @default {
    <app-branch-sidebar [branch]="branch" [loading]="status === 'loading'" />

    <section class="branch-main" [attr.aria-busy]="status === 'loading'">
      <p-tabView styleClass="req-tabs branch-tabs" [(activeIndex)]="activeTab">
        <p-tabPanel header="Cadastro">
          <app-branch-register [branch]="branch" [loading]="status === 'loading'" (saved)="onSaved($event)" />
        </p-tabPanel>

        <p-tabPanel header="Almoxarifado">
          <!-- conteúdo lazy: só carrega os almoxarifados quando a aba é aberta (e mantém ao trocar de aba) -->
          <ng-template pTemplate="content">
            <app-branch-stock-partitions [branchCode]="branch?.codigo ?? null" />
          </ng-template>
        </p-tabPanel>

        <p-tabPanel header="Repositório">
          <!-- conteúdo lazy, como na aba Almoxarifado -->
          <ng-template pTemplate="content">
            <app-branch-repositories [branchCode]="branch?.codigo ?? null" />
          </ng-template>
        </p-tabPanel>
      </p-tabView>
    </section>
  }
}
