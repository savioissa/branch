@if (loading || !repository) {
  <div class="skeleton card-skeleton" aria-hidden="true"></div>
} @else {
  <article class="reg-card repository-card" [class.repository-card--link]="stockPartition">
    @if (stockPartition) {
      <div class="kv">
        <span class="kv-k">Almoxarifado</span>
        <span class="kv-v" [title]="almoxarifadoLabel">{{ almoxarifadoLabel }}</span>
      </div>
    }
    <div class="kv">
      <span class="kv-k">Tipo</span>
      <span class="kv-v">{{ tipoLabel }}</span>
    </div>
    <div class="kv">
      <span class="kv-k">{{ labels.codigo }}</span>
      <span class="kv-v" [title]="repository.codigo">{{ repository.codigo }}</span>
    </div>
    <div class="kv">
      <span class="kv-k">{{ labels.nome }}</span>
      <span class="kv-v" [title]="repository.nome">{{ repository.nome }}</span>
    </div>
    <div class="card-actions">
      @if (unlinkable) {
        <p-button
          icon="pi pi-link-slash"
          [text]="true"
          styleClass="btn--md btn--danger btn--text"
          (onClick)="unlink.emit(repository)"
        />
      }
      @if (pickable) {
        <p-button label="Selecionar" styleClass="btn--md btn--primary card-actions__pick" (onClick)="pick.emit(repository)" />
      }
      <p-button
        icon="pi pi-window-maximize"
        [text]="true"
        styleClass="btn--md btn--text icon-neutral"
        (onClick)="open.emit(repository)"
      />
    </div>
  </article>
}
