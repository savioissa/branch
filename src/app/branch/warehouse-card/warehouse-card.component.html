@if (loading || !warehouse) {
  <div class="skeleton card-skeleton" aria-hidden="true"></div>
} @else {
  <article
    class="reg-card warehouse-card"
    [class.warehouse-card--selectable]="selectable"
    [class.warehouse-card--selected]="selectable && selected"
  >
    @if (selectable) {
      <p-checkbox
        [binary]="true"
        [ngModel]="selected"
        (ngModelChange)="selectedChange.emit($event)"
        [inputId]="'warehouse-select-' + warehouse.codigo"
        [ariaLabel]="'Selecionar almoxarifado ' + warehouse.descricao"
      />
    }
    <div class="kv">
      <span class="kv-k">Código</span>
      <span class="kv-v" [title]="warehouse.codigo">{{ warehouse.codigo }}</span>
    </div>
    <div class="kv">
      <span class="kv-k">Descrição</span>
      <span class="kv-v" [title]="warehouse.descricao">{{ warehouse.descricao }}</span>
    </div>
    <p-button
      icon="pi pi-external-link"
      [text]="true"
      ariaLabel="Abrir almoxarifado {{ warehouse.descricao }}"
      styleClass="btn--md btn--text icon-neutral"
      (onClick)="open.emit(warehouse)"
    />
  </article>
}
