<form [formGroup]="form" (ngSubmit)="salvar()" class="branch-form" novalidate>
  <header class="page-header">
    <h1 class="t-title-lg page-header__title">Nova Filial</h1>

    <div class="page-header__actions">
      <p-button
        label="Cancelar"
        type="button"
        styleClass="btn--lg btn--neutral"
        [disabled]="saving"
        (onClick)="cancelar()"
      />
      <p-button
        label="Salvar"
        type="submit"
        styleClass="btn--lg btn--primary"
        [disabled]="form.invalid"
        [loading]="saving"
      />
    </div>
  </header>

  <main class="page-content">
    <app-branch-fields [group]="form" />
  </main>
</form>

<!-- confirmação ao cancelar com campos preenchidos -->
<p-confirmDialog styleClass="leave-dialog" [style]="{ width: '420px' }" />
